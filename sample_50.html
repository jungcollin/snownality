<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Magono-Lee Snow Crystal Icons (41–50)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b16;
      color: #e5f4ff;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 20px;
      letter-spacing: 0.03em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(7, 21, 38, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(160, 210, 235, 0.2);
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    }
    .card svg {
      width: 100px;
      height: 100px;
      margin-bottom: 6px;
    }
    .code {
      font-size: 12px;
      color: #7fb6d8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      font-size: 13px;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>눈 결정 아이콘 (ID 41–50)</h1>
  <div class="grid">

    <!-- 41. P6c Frame Sheet / 미니멀리스트 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 바깥 프레임 육각 -->
          <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" />
          <!-- 안쪽 빈 프레임 육각 -->
          <polygon points="0,-12 11,-6 11,6 0,12 -11,6 -11,-6" />
          <!-- 일부 모서리는 끊어서 미니멀 프레임 느낌 -->
          <line x1="0" y1="-18" x2="6" y2="-15" />
          <line x1="0" y1="-18" x2="-6" y2="-15" />
          <!-- 짧은 직선 확장 (아주 심플하게) -->
          <g id="arm-p6c">
            <line x1="0" y1="-18" x2="0" y2="-24" />
          </g>
          <use href="#arm-p6c" />
          <g transform="rotate(60)"><use href="#arm-p6c" /></g>
          <g transform="rotate(120)"><use href="#arm-p6c" /></g>
          <g transform="rotate(180)"><use href="#arm-p6c" /></g>
          <g transform="rotate(240)"><use href="#arm-p6c" /></g>
          <g transform="rotate(300)"><use href="#arm-p6c" /></g>
        </g>
        <defs>
          <g id="arm-p6c">
            <line x1="0" y1="-18" x2="0" y2="-24" />
          </g>
        </defs>
      </svg>
      <div class="code">P6c</div>
      <div class="title">미니멀리스트</div>
    </div>

    <!-- 42. P6d Combination of Plates / 조각보 모음 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 육각 판 -->
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <!-- 겹겹이 이어진 작은 판 조각들 -->
          <polygon points="0,-18 8,-14 8,-6 0,-2 -8,-6 -8,-14" />
          <polygon points="0,2 8,6 8,14 0,18 -8,14 -8,6" />
          <!-- 팔 끝에 작은 판 조각 -->
          <g id="arm-p6d">
            <polygon points="0,-18 5,-15 5,-11 0,-14 -5,-11 -5,-15" />
          </g>
          <use href="#arm-p6d" />
          <g transform="rotate(60)"><use href="#arm-p6d" /></g>
          <g transform="rotate(120)"><use href="#arm-p6d" /></g>
          <g transform="rotate(180)"><use href="#arm-p6d" /></g>
          <g transform="rotate(240)"><use href="#arm-p6d" /></g>
          <g transform="rotate(300)"><use href="#arm-p6d" /></g>
        </g>
        <defs>
          <g id="arm-p6d">
            <polygon points="0,-18 5,-15 5,-11 0,-14 -5,-11 -5,-15" />
          </g>
        </defs>
      </svg>
      <div class="code">P6d</div>
      <div class="title">조각보 모음</div>
    </div>

    <!-- 43. P7a Radiating Dendrites / 축제 기획자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중심 육각 -->
          <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" />
          <!-- 폭죽처럼 튀어나가는 덴드라이트 팔 -->
          <g id="arm-p7a">
            <line x1="0" y1="-8" x2="0" y2="-30" />
            <!-- 가지 1 -->
            <line x1="0" y1="-14" x2="5" y2="-19" />
            <line x1="0" y1="-14" x2="-5" y2="-19" />
            <!-- 가지 2 -->
            <line x1="0" y1="-21" x2="6" y2="-26" />
            <line x1="0" y1="-21" x2="-6" y2="-26" />
            <!-- 끝 점 -->
            <circle cx="0" cy="-30" r="1.6" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p7a" />
          <g transform="rotate(60)"><use href="#arm-p7a" /></g>
          <g transform="rotate(120)"><use href="#arm-p7a" /></g>
          <g transform="rotate(180)"><use href="#arm-p7a" /></g>
          <g transform="rotate(240)"><use href="#arm-p7a" /></g>
          <g transform="rotate(300)"><use href="#arm-p7a" /></g>
        </g>
        <defs>
          <g id="arm-p7a">
            <line x1="0" y1="-8" x2="0" y2="-30" />
            <line x1="0" y1="-14" x2="5" y2="-19" />
            <line x1="0" y1="-14" x2="-5" y2="-19" />
            <line x1="0" y1="-21" x2="6" y2="-26" />
            <line x1="0" y1="-21" x2="-6" y2="-26" />
            <circle cx="0" cy="-30" r="1.6" />
          </g>
        </defs>
      </svg>
      <div class="code">P7a</div>
      <div class="title">축제 기획자</div>
    </div>

    <!-- 44. P7b Spatial Dendrites / 4차원 예술가 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 살짝 어긋난 이중 육각 (입체감) -->
          <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" />
          <polygon points="2,-12 9,-8 9,0 2,4 -5,0 -5,-8" />
          <!-- 비틀린 덴드라이트 팔 -->
          <g id="arm-p7b">
            <path d="M0 -8
                     C2 -16, 6 -20, 8 -24
                     C9 -27, 7 -30, 4 -32" />
            <line x1="0" y1="-14" x2="4" y2="-18" />
            <line x1="1" y1="-20" x2="-3" y2="-24" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p7b" />
          <g transform="rotate(60)"><use href="#arm-p7b" /></g>
          <g transform="rotate(120)"><use href="#arm-p7b" /></g>
          <g transform="rotate(180)"><use href="#arm-p7b" /></g>
          <g transform="rotate(240)"><use href="#arm-p7b" /></g>
          <g transform="rotate(300)"><use href="#arm-p7b" /></g>
        </g>
        <defs>
          <g id="arm-p7b">
            <path d="M0 -8
                     C2 -16, 6 -20, 8 -24
                     C9 -27, 7 -30, 4 -32" />
            <line x1="0" y1="-14" x2="4" y2="-18" />
            <line x1="1" y1="-20" x2="-3" y2="-24" />
          </g>
        </defs>
      </svg>
      <div class="code">P7b</div>
      <div class="title">4차원 예술가</div>
    </div>

    <!-- 45. CP1a Column with Plates / 반전 매력 츤데레 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 기둥 -->
          <line x1="0" y1="-26" x2="0" y2="26" />
          <!-- 위아래 육각 단면 -->
          <polygon points="0,-30 8,-26 8,-22 0,-18 -8,-22 -8,-26" />
          <polygon points="0,30 8,26 8,22 0,18 -8,22 -8,26" />
          <!-- 중간에 끼워진 판(플레이트) -->
          <polygon points="0,-8 10,-4 10,4 0,8 -10,4 -10,-4" />
          <!-- 살짝 튀어나오는 반전 가지 -->
          <line x1="-12" y1="-8" x2="-18" y2="-8" />
          <line x1="12" y1="8" x2="18" y2="8" />
        </g>
      </svg>
      <div class="code">CP1a</div>
      <div class="title">반전 매력 츤데레</div>
    </div>

    <!-- 46. CP1b Column with Dendrites / 화려한 변신 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 기둥 -->
          <line x1="0" y1="-28" x2="0" y2="28" />
          <!-- 위/아래 육각 -->
          <polygon points="0,-32 7,-28 7,-24 0,-20 -7,-24 -7,-28" />
          <polygon points="0,32 7,28 7,24 0,20 -7,24 -7,28" />
          <!-- 덴드라이트 가지 층층이 -->
          <line x1="0" y1="-18" x2="6" y2="-22" />
          <line x1="0" y1="-18" x2="-6" y2="-22" />
          <line x1="0" y1="-10" x2="7" y2="-13" />
          <line x1="0" y1="-10" x2="-7" y2="-13" />
          <line x1="0" y1="-2" x2="7" y2="-5" />
          <line x1="0" y1="-2" x2="-7" y2="-5" />
          <line x1="0" y1="6" x2="6" y2="10" />
          <line x1="0" y1="6" x2="-6" y2="10" />
          <line x1="0" y1="14" x2="5" y2="18" />
          <line x1="0" y1="14" x2="-5" y2="18" />
        </g>
      </svg>
      <div class="code">CP1b</div>
      <div class="title">화려한 변신</div>
    </div>

    <!-- 47. CP1c Multiple Capped Column / 레이어드 마스터 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 여러 개의 캡이 겹쳐진 기둥 -->
          <!-- 중앙 기둥 -->
          <line x1="0" y1="-30" x2="0" y2="30" />
          <!-- 상단 캡들 -->
          <polygon points="0,-30 8,-26 8,-22 0,-18 -8,-22 -8,-26" />
          <polygon points="0,-22 7,-18 7,-14 0,-10 -7,-14 -7,-18" />
          <!-- 중간 캡 -->
          <polygon points="0,-6 9,-2 9,2 0,6 -9,2 -9,-2" />
          <!-- 하단 캡들 -->
          <polygon points="0,10 7,14 7,18 0,22 -7,18 -7,14" />
          <polygon points="0,18 8,22 8,26 0,30 -8,26 -8,22" />
        </g>
      </svg>
      <div class="code">CP1c</div>
      <div class="title">레이어드 마스터</div>
    </div>

    <!-- 48. CP2a Bullet with Plates / 전략적 행동파 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 탄환형 몸체 -->
          <path d="M0 -28
                   C6 -24, 10 -18, 10 -10
                   L10 14
                   C10 18, 6 22, 0 24
                   C-6 22, -10 18, -10 14
                   L-10 -10
                   C-10 -18, -6 -24, 0 -28 Z" />
          <!-- 내부 축 -->
          <line x1="0" y1="-26" x2="0" y2="22" />
          <!-- 중간중간 판(플레이트) -->
          <line x1="-8" y1="-14" x2="8" y2="-14" />
          <line x1="-8" y1="-4" x2="8" y2="-4" />
          <line x1="-7" y1="6" x2="7" y2="6" />
        </g>
      </svg>
      <div class="code">CP2a</div>
      <div class="title">전략적 행동파</div>
    </div>

    <!-- 49. CP2b Bullet with Dendrites / 로맨틱 행동대장 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 탄환형 몸체 -->
          <path d="M0 -26
                   C6 -22, 10 -16, 10 -8
                   L10 10
                   C10 16, 6 22, 0 24
                   C-6 22, -10 16, -10 10
                   L-10 -8
                   C-10 -16, -6 -22, 0 -26 Z" />
          <!-- 덴드라이트 가지 (둘레에서 꽃처럼) -->
          <line x1="0" y1="-10" x2="6" y2="-14" />
          <line x1="0" y1="-10" x2="-6" y2="-14" />
          <line x1="0" y1="0" x2="7" y2="-2" />
          <line x1="0" y1="0" x2="-7" y2="-2" />
          <line x1="0" y1="8" x2="6" y2="12" />
          <line x1="0" y1="8" x2="-6" y2="12" />
          <circle cx="0" cy="0" r="2" />
        </g>
      </svg>
      <div class="code">CP2b</div>
      <div class="title">로맨틱 행동대장</div>
    </div>

    <!-- 50. CP3 Irregular Column / 자유분방한 방랑자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 약간 휘어진 불규칙 기둥 -->
          <path d="M0 -28
                   C2 -24, 3 -18, 0 -12
                   C-3 -6, -2 0, 1 6
                   C3 12, 2 18, 0 24" />
          <!-- 여기저기 붙은 작은 단면/플레이트 -->
          <polygon points="0,-22 5,-19 5,-15 0,-18 -5,-15 -5,-19" />
          <polygon points="-1,-8 4,-5 4,-1 -1,-4 -6,-1 -6,-5" />
          <polygon points="1,10 6,13 6,17 1,14 -4,17 -4,13" />
          <!-- 자유로운 짧은 가지 -->
          <line x1="-8" y1="-14" x2="-12" y2="-18" />
          <line x1="8" y1="-2" x2="13" y2="-4" />
          <line x1="-7" y1="8" x2="-12" y2="10" />
        </g>
      </svg>
      <div class="code">CP3</div>
      <div class="title">자유분방한 방랑자</div>
    </div>

  </div>
</body>
</html>
