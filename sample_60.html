<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Magono-Lee Snow Crystal Icons (51–60)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b16;
      color: #e5f4ff;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 20px;
      letter-spacing: 0.03em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(7, 21, 38, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(160, 210, 235, 0.2);
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    }
    .card svg {
      width: 100px;
      height: 100px;
      margin-bottom: 6px;
    }
    .code {
      font-size: 12px;
      color: #7fb6d8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      font-size: 13px;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>눈 결정 아이콘 (ID 51–60)</h1>
  <div class="grid">

    <!-- 51. S1 Side Plane / 비판적 몽상가 : 한쪽에 날개가 달린 기둥 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 기둥 -->
          <line x1="0" y1="-26" x2="0" y2="26" />
          <!-- 위아래 육각 단면 -->
          <polygon points="0,-30 7,-26 7,-22 0,-18 -7,-22 -7,-26" />
          <polygon points="0,30 7,26 7,22 0,18 -7,22 -7,26" />
          <!-- 한쪽으로 튀어나온 사이드 플레이트 -->
          <polygon points="0,-6 10,-2 10,6 0,10 -10,6 -10,-2" />
          <!-- 위쪽에 작은 보조 사이드 플레이트 -->
          <polygon points="0,-16 7,-13 7,-9 0,-6 -7,-9 -7,-13" />
        </g>
      </svg>
      <div class="code">S1</div>
      <div class="title">비판적 몽상가</div>
    </div>

    <!-- 52. S2 Scale-like Side Plane / 균형 잡힌 곡예사 : 비늘처럼 겹친 사이드 플레이트 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 기둥 -->
          <line x1="0" y1="-28" x2="0" y2="28" />
          <!-- 위아래 단면 -->
          <polygon points="0,-32 7,-28 7,-24 0,-20 -7,-24 -7,-28" />
          <polygon points="0,32 7,28 7,24 0,20 -7,24 -7,28" />
          <!-- 오른쪽에 비늘처럼 겹친 플레이트 -->
          <polygon points="0,-18 9,-14 9,-8 0,-4 -9,-8 -9,-14" />
          <polygon points="0,-8 9,-4 9,2 0,6 -9,2 -9,-4" />
          <polygon points="0,2 9,6 9,12 0,16 -9,12 -9,6" />
          <!-- 왼쪽에 작은 균형용 플레이트 -->
          <polygon points="-9,-2 -4,0 -4,4 -9,6 -14,4 -14,0" />
        </g>
      </svg>
      <div class="code">S2</div>
      <div class="title">균형 잡힌 곡예사</div>
    </div>

    <!-- 53. S3 Irregular Side Plane / 즉흥 연주자 : 여기저기 붙은 비틀린 사이드 플레이트 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 기둥(약간 휘어진 선) -->
          <path d="M0 -28 C2 -20, -2 -10, 0 0 C2 8, -1 18, 0 28" />
          <!-- 불규칙하게 붙은 플레이트들 -->
          <polygon points="0,-20 8,-16 7,-10 -1,-12 -8,-14 -7,-18" />
          <polygon points="2,-6 9,-2 8,4 1,2 -6,0 -5,-4" />
          <polygon points="-1,10 6,14 5,20 -2,18 -8,16 -7,12" />
        </g>
      </svg>
      <div class="code">S3</div>
      <div class="title">즉흥 연주자</div>
    </div>

    <!-- 54. R1a Rimed Needle / 강인한 송곳 : 바늘 주위에 서리(림)가 낀 모습 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 바늘 -->
          <line x1="0" y1="-30" x2="0" y2="30" />
          <polygon points="0,-34 4,-30 0,-26 -4,-30" />
          <polygon points="0,34 4,30 0,26 -4,30" />
          <!-- 바늘 주변에 붙은 서리(짧은 가지와 점) -->
          <line x1="0" y1="-20" x2="4" y2="-24" />
          <line x1="0" y1="-14" x2="-4" y2="-18" />
          <line x1="0" y1="-6" x2="5" y2="-9" />
          <line x1="0" y1="2" x2="-5" y2="-1" />
          <line x1="0" y1="10" x2="5" y2="13" />
          <line x1="0" y1="18" x2="-4" y2="22" />
          <circle cx="4" cy="-24" r="1.3" />
          <circle cx="-4" cy="-18" r="1.3" />
          <circle cx="5" cy="-9" r="1.3" />
          <circle cx="-5" cy="-1" r="1.3" />
          <circle cx="5" cy="13" r="1.3" />
          <circle cx="-4" cy="22" r="1.3" />
        </g>
      </svg>
      <div class="code">R1a</div>
      <div class="title">강인한 송곳</div>
    </div>

    <!-- 55. R1b Rimed Column / 굳건한 바위 : 육각 기둥을 두껍게 감싼 서리 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 안쪽 육각 기둥 -->
          <polygon points="0,-20 9,-12 9,12 0,20 -9,12 -9,-12" />
          <!-- 바깥 서리 림(두꺼운 윤곽선 느낌) -->
          <polygon points="0,-24 13,-14 13,14 0,24 -13,14 -13,-14" />
          <!-- 주변에 박힌 서리 덩어리들 -->
          <circle cx="-15" cy="-8" r="1.6" />
          <circle cx="15" cy="-4" r="1.6" />
          <circle cx="-14" cy="6" r="1.6" />
          <circle cx="14" cy="10" r="1.6" />
          <circle cx="0" cy="-26" r="1.6" />
          <circle cx="0" cy="26" r="1.6" />
        </g>
      </svg>
      <div class="code">R1b</div>
      <div class="title">굳건한 바위</div>
    </div>

    <!-- 56. R1c Rimed Plate / 생활력 만렙 : 육각 판 주변에 서리가 두텁게 낀 모습 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 안쪽 육각 판 -->
          <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" />
          <!-- 바깥 림(서리가 둘러싼 윤곽) -->
          <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" />
          <!-- 가장자리 따라 박힌 서리 알갱이 -->
          <circle cx="0" cy="-18" r="1.5" />
          <circle cx="9" cy="-13" r="1.5" />
          <circle cx="15" cy="0" r="1.5" />
          <circle cx="9" cy="13" r="1.5" />
          <circle cx="0" cy="18" r="1.5" />
          <circle cx="-9" cy="13" r="1.5" />
          <circle cx="-15" cy="0" r="1.5" />
          <circle cx="-9" cy="-13" r="1.5" />
        </g>
      </svg>
      <div class="code">R1c</div>
      <div class="title">생활력 만렙</div>
    </div>

    <!-- 57. R1d Rimed Dendrite / 상처 입은 백조 : 덴드라이트 가지에 서리가 얹힌 눈결정 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중심 육각 -->
          <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" />
          <!-- 덴드라이트 팔 -->
          <g id="arm-r1d">
            <line x1="0" y1="-6" x2="0" y2="-26" />
            <line x1="0" y1="-12" x2="4" y2="-16" />
            <line x1="0" y1="-18" x2="-4" y2="-22" />
            <!-- 끝 서리 덩어리 -->
            <circle cx="0" cy="-26" r="1.8" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-r1d" />
          <g transform="rotate(60)"><use href="#arm-r1d" /></g>
          <g transform="rotate(120)"><use href="#arm-r1d" /></g>
          <g transform="rotate(180)"><use href="#arm-r1d" /></g>
          <g transform="rotate(240)"><use href="#arm-r1d" /></g>
          <g transform="rotate(300)"><use href="#arm-r1d" /></g>
          <!-- 가지 중간 중간 서리 점 -->
          <circle cx="4" cy="-16" r="1.3" />
          <circle cx="-4" cy="-22" r="1.3" />
        </g>
        <defs>
          <g id="arm-r1d">
            <line x1="0" y1="-6" x2="0" y2="-26" />
            <line x1="0" y1="-12" x2="4" y2="-16" />
            <line x1="0" y1="-18" x2="-4" y2="-22" />
            <circle cx="0" cy="-26" r="1.8" />
          </g>
        </defs>
      </svg>
      <div class="code">R1d</div>
      <div class="title">상처 입은 백조</div>
    </div>

    <!-- 58. R2a Densely Rimed Needle / 무뚝뚝한 장인 : 바늘 전체를 감싼 두꺼운 서리 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 안쪽 바늘 -->
          <line x1="0" y1="-26" x2="0" y2="26" />
          <!-- 바깥 서리로 두꺼워진 윤곽 -->
          <path d="M-4 -28 L4 -28 L6 -24 L6 24 L4 28 L-4 28 L-6 24 L-6 -24 Z" />
          <!-- 표면에 울퉁불퉁 박힌 서리 덩어리 -->
          <circle cx="-5" cy="-18" r="1.7" />
          <circle cx="5" cy="-10" r="1.7" />
          <circle cx="-5" cy="-2" r="1.7" />
          <circle cx="5" cy="6" r="1.7" />
          <circle cx="-5" cy="14" r="1.7" />
        </g>
      </svg>
      <div class="code">R2a</div>
      <div class="title">무뚝뚝한 장인</div>
    </div>

    <!-- 59. R2b Densely Rimed Column / 철옹성 : 두꺼운 기둥 모양에 서리가 꽉 찬 결정 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 안쪽 육각 기둥 -->
          <polygon points="0,-18 9,-12 9,12 0,18 -9,12 -9,-12" />
          <!-- 바깥 두꺼운 서리층 -->
          <polygon points="0,-24 14,-16 14,16 0,24 -14,16 -14,-16" />
          <!-- 서리 알갱이로 더 채움 -->
          <circle cx="-12" cy="-10" r="1.8" />
          <circle cx="12" cy="-6" r="1.8" />
          <circle cx="-13" cy="2" r="1.8" />
          <circle cx="13" cy="8" r="1.8" />
          <circle cx="0" cy="-26" r="1.8" />
          <circle cx="0" cy="26" r="1.8" />
        </g>
      </svg>
      <div class="code">R2b</div>
      <div class="title">철옹성</div>
    </div>

    <!-- 60. R2c Graupel (Hexagonal) / 싸라기눈 (육각) : 육각형 덩어리 형태의 싸라기눈 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 육각형 핵심 덩어리 -->
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <!-- 약간 불규칙한 바깥 윤곽(싸라기눈 뭉침) -->
          <polygon points="0,-18 11,-11 13,0 8,11 0,18 -9,14 -14,4 -12,-9" />
          <!-- 표면의 알갱이들 -->
          <circle cx="0" cy="-14" r="1.8" />
          <circle cx="8" cy="-7" r="1.8" />
          <circle cx="10" cy="4" r="1.8" />
          <circle cx="0" cy="14" r="1.8" />
          <circle cx="-9" cy="8" r="1.8" />
          <circle cx="-10" cy="-2" r="1.8" />
        </g>
      </svg>
      <div class="code">R2c</div>
      <div class="title">싸라기눈 (육각)</div>
    </div>

  </div>
</body>
</html>
