<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Magono-Lee Snow Crystal Icons (11–20)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b16;
      color: #e5f4ff;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 20px;
      letter-spacing: 0.03em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(7, 21, 38, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(160, 210, 235, 0.2);
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    }
    .card svg {
      width: 100px;
      height: 100px;
      margin-bottom: 6px;
    }
    .code {
      font-size: 12px;
      color: #7fb6d8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      font-size: 13px;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>눈 결정 아이콘 (ID 11–20)</h1>
  <div class="grid">

    <!-- 11. C1c Solid Prism / 정직한 원칙주의자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 단단한 육각 기둥 -->
          <polygon points="0,-20 10,-12 10,12 0,20 -10,12 -10,-12" />
          <!-- 위아래 단면 강조 -->
          <polygon points="0,-26 8,-20 8,-14 0,-10 -8,-14 -8,-20" />
          <polygon points="0,26 8,20 8,14 0,10 -8,14 -8,20" />
          <!-- 내부 축 -->
          <line x1="0" y1="-26" x2="0" y2="26" />
          <!-- 짧은 방사형 가지 (원칙의 균형감) -->
          <line x1="-14" y1="0" x2="-20" y2="0" />
          <line x1="14" y1="0" x2="20" y2="0" />
          <line x1="-10" y1="-10" x2="-15" y2="-13" />
          <line x1="10" y1="-10" x2="15" y2="-13" />
          <line x1="-10" y1="10" x2="-15" y2="13" />
          <line x1="10" y1="10" x2="15" y2="13" />
        </g>
      </svg>
      <div class="code">C1c</div>
      <div class="title">정직한 원칙주의자</div>
    </div>

    <!-- 12. C1d Hollow Prism / 실속파 현실주의자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 바깥 육각 기둥 -->
          <polygon points="0,-20 10,-12 10,12 0,20 -10,12 -10,-12" />
          <!-- 안쪽 비어있는 육각 (속이 빈 프리즘) -->
          <polygon points="0,-14 7,-9 7,9 0,14 -7,9 -7,-9" />
          <!-- 위아래 림 -->
          <line x1="-10" y1="-12" x2="10" y2="-12" />
          <line x1="-10" y1="12" x2="10" y2="12" />
          <!-- 현실 감각의 짧은 가지 -->
          <line x1="-14" y1="-2" x2="-20" y2="-2" />
          <line x1="14" y1="2" x2="20" y2="2" />
        </g>
      </svg>
      <div class="code">C1d</div>
      <div class="title">실속파 현실주의자</div>
    </div>

    <!-- 13. C1e Solid Column / 뚝심 있는 장군 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 두꺼운 육각 스택 -->
          <polygon points="0,-24 11,-16 11,-6 0,2 -11,-6 -11,-16" />
          <polygon points="0,2 11,10 11,20 0,28 -11,20 -11,10" />
          <!-- 가운데 띠 -->
          <line x1="-11" y1="-2" x2="11" y2="-2" />
          <!-- 내부 축 -->
          <line x1="0" y1="-24" x2="0" y2="28" />
          <!-- 양옆 짧은 방패형 가지 -->
          <path d="M-16 -4 L-20 0 L-16 4" />
          <path d="M16 -4 L20 0 L16 4" />
        </g>
      </svg>
      <div class="code">C1e</div>
      <div class="title">뚝심 있는 장군</div>
    </div>

    <!-- 14. C1f Hollow Column / 유연한 보스 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 바깥 기둥 -->
          <polygon points="0,-24 11,-16 11,16 0,24 -11,16 -11,-16" />
          <!-- 안쪽 기둥 (속이 빈 느낌) -->
          <polygon points="0,-18 7,-11 7,11 0,18 -7,11 -7,-11" />
          <!-- 상단/하단 링 -->
          <line x1="-11" y1="-16" x2="11" y2="-16" />
          <line x1="-11" y1="16" x2="11" y2="16" />
          <!-- 부드러운 곡선 가지 -->
          <path d="M-16 -6 C-20 -4, -20 4, -16 6" />
          <path d="M16 -6 C20 -4, 20 4, 16 6" />
        </g>
      </svg>
      <div class="code">C1f</div>
      <div class="title">유연한 보스</div>
    </div>

    <!-- 15. C1g Solid Thick Plate / 단단한 방패 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 두꺼운 육각 판 -->
          <polygon points="0,-18 16,-8 16,8 0,18 -16,8 -16,-8" />
          <!-- 안쪽 육각 (중심 코어) -->
          <polygon points="0,-10 9,-4 9,4 0,10 -9,4 -9,-4" />
          <!-- 짧은 기둥 위/아래 -->
          <line x1="0" y1="-24" x2="0" y2="-18" />
          <line x1="0" y1="18" x2="0" y2="24" />
          <!-- 방패형 가지 6개 -->
          <g id="arm-c1g">
            <line x1="0" y1="-18" x2="0" y2="-30" />
            <polygon points="0,-30 4,-27 4,-23 0,-20 -4,-23 -4,-27" />
          </g>
          <g transform="rotate(60)"><use href="#arm-c1g" /></g>
          <g transform="rotate(120)"><use href="#arm-c1g" /></g>
          <g transform="rotate(180)"><use href="#arm-c1g" /></g>
          <g transform="rotate(240)"><use href="#arm-c1g" /></g>
          <g transform="rotate(300)"><use href="#arm-c1g" /></g>
        </g>
        <defs>
          <g id="arm-c1g">
            <line x1="0" y1="-18" x2="0" y2="-30" />
            <polygon points="0,-30 4,-27 4,-23 0,-20 -4,-23 -4,-27" />
          </g>
        </defs>
      </svg>
      <div class="code">C1g</div>
      <div class="title">단단한 방패</div>
    </div>

    <!-- 16. C1h Hollow Thick Plate / 내유외강 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 바깥 두꺼운 육각 -->
          <polygon points="0,-18 16,-8 16,8 0,18 -16,8 -16,-8" />
          <!-- 안쪽 작은 육각 (속은 따뜻함) -->
          <polygon points="0,-9 8,-4 8,4 0,9 -8,4 -8,-4" />
          <!-- 링 느낌 라인 -->
          <line x1="-16" y1="0" x2="16" y2="0" />
          <!-- 부드런 짧은 가지 -->
          <g id="arm-c1h">
            <line x1="0" y1="-18" x2="0" y2="-28" />
            <path d="M0 -28 C2 -30, 4 -30, 6 -28" />
          </g>
          <g transform="rotate(60)"><use href="#arm-c1h" /></g>
          <g transform="rotate(120)"><use href="#arm-c1h" /></g>
          <g transform="rotate(180)"><use href="#arm-c1h" /></g>
          <g transform="rotate(240)"><use href="#arm-c1h" /></g>
          <g transform="rotate(300)"><use href="#arm-c1h" /></g>
        </g>
        <defs>
          <g id="arm-c1h">
            <line x1="0" y1="-18" x2="0" y2="-28" />
            <path d="M0 -28 C2 -30, 4 -30, 6 -28" />
          </g>
        </defs>
      </svg>
      <div class="code">C1h</div>
      <div class="title">내유외강</div>
    </div>

    <!-- 17. C1i Scroll / 지혜로운 기록자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 말려있는 두루마리형 기둥 실루엣 -->
          <path d="M-10 -20
                   C-4 -24, 4 -24, 10 -20
                   L10 18
                   C4 22, -4 22, -10 18 Z" />
          <!-- 상단 말린 부분 -->
          <path d="M-10 -20
                   C-9 -14, -5 -10, 0 -10
                   C5 -10, 9 -14, 10 -20" />
          <!-- 하단 말린 부분 -->
          <path d="M-10 18
                   C-9 12, -5 8, 0 8
                   C5 8, 9 12, 10 18" />
          <!-- 안쪽 세로 줄 (기록 라인) -->
          <line x1="-3" y1="-14" x2="-3" y2="12" />
          <line x1="3" y1="-14" x2="3" y2="12" />
          <!-- 주변에 잉크처럼 짧은 가지 -->
          <line x1="-18" y1="0" x2="-12" y2="0" />
          <line x1="18" y1="0" x2="12" y2="0" />
          <line x1="-14" y1="-8" x2="-10" y2="-10" />
          <line x1="14" y1="-8" x2="10" y2="-10" />
        </g>
      </svg>
      <div class="code">C1i</div>
      <div class="title">지혜로운 기록자</div>
    </div>

    <!-- 18. C2a Bullet / 돌진하는 개척자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 탄환형 기둥 -->
          <path d="M0 -28
                   C6 -24, 10 -18, 10 -10
                   L10 14
                   C10 18, 6 22, 0 24
                   C-6 22, -10 18, -10 14
                   L-10 -10
                   C-10 -18, -6 -24, 0 -28 Z" />
          <!-- 내부 축 -->
          <line x1="0" y1="-26" x2="0" y2="22" />
          <!-- 속도감을 주는 옆 가지 -->
          <line x1="-18" y1="-6" x2="-10" y2="-6" />
          <line x1="-20" y1="0" x2="-10" y2="0" />
          <line x1="-18" y1="6" x2="-10" y2="6" />
        </g>
      </svg>
      <div class="code">C2a</div>
      <div class="title">돌진하는 개척자</div>
    </div>

    <!-- 19. C2b Combination of Bullets / 다재다능 멀티태스커 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중심 육각 코어 -->
          <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" />

          <!-- 하나의 탄환형 팔 -->
          <g id="arm-c2b">
            <path d="M0 -6
                     C4 -10, 7 -14, 7 -18
                     C7 -22, 4 -26, 0 -28
                     C-4 -26, -7 -22, -7 -18
                     C-7 -14, -4 -10, 0 -6 Z" />
          </g>

          <!-- 6방향으로 탄환을 배치 -->
          <use href="#arm-c2b" />
          <g transform="rotate(60)"><use href="#arm-c2b" /></g>
          <g transform="rotate(120)"><use href="#arm-c2b" /></g>
          <g transform="rotate(180)"><use href="#arm-c2b" /></g>
          <g transform="rotate(240)"><use href="#arm-c2b" /></g>
          <g transform="rotate(300)"><use href="#arm-c2b" /></g>
        </g>
        <defs>
          <g id="arm-c2b">
            <path d="M0 -6
                     C4 -10, 7 -14, 7 -18
                     C7 -22, 4 -26, 0 -28
                     C-4 -26, -7 -22, -7 -18
                     C-7 -14, -4 -10, 0 -6 Z" />
          </g>
        </defs>
      </svg>
      <div class="code">C2b</div>
      <div class="title">다재다능 멀티태스커</div>
    </div>

    <!-- 20. P1a Hexagonal Plate / 정석 모범생 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 큰 육각 판 -->
          <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" />
          <!-- 안쪽 육각 -->
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <!-- 추가 육각 링 -->
          <polygon points="0,-15 13,-8 13,8 0,15 -13,8 -13,-8" />
          <!-- 한 팔(판형 가지) 정의 -->
          <g id="arm-p1a">
            <!-- 메인 팔 -->
            <line x1="0" y1="-20" x2="0" y2="-32" />
            <!-- 팔 끝 작은 판 -->
            <polygon points="0,-32 6,-29 6,-23 0,-20 -6,-23 -6,-29" />
            <!-- 중간 얕은 돌기 -->
            <line x1="-4" y1="-24" x2="-8" y2="-22" />
            <line x1="4" y1="-24" x2="8" y2="-22" />
          </g>
          <!-- 6방향 회전 배치 -->
          <use href="#arm-p1a" />
          <g transform="rotate(60)"><use href="#arm-p1a" /></g>
          <g transform="rotate(120)"><use href="#arm-p1a" /></g>
          <g transform="rotate(180)"><use href="#arm-p1a" /></g>
          <g transform="rotate(240)"><use href="#arm-p1a" /></g>
          <g transform="rotate(300)"><use href="#arm-p1a" /></g>
        </g>
        <defs>
          <g id="arm-p1a">
            <line x1="0" y1="-20" x2="0" y2="-32" />
            <polygon points="0,-32 6,-29 6,-23 0,-20 -6,-23 -6,-29" />
            <line x1="-4" y1="-24" x2="-8" y2="-22" />
            <line x1="4" y1="-24" x2="8" y2="-22" />
          </g>
        </defs>
      </svg>
      <div class="code">P1a</div>
      <div class="title">정석 모범생</div>
    </div>

  </div>
</body>
</html>
