<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Magono-Lee Snow Crystal Icons (21–30)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b16;
      color: #e5f4ff;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 20px;
      letter-spacing: 0.03em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(7, 21, 38, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(160, 210, 235, 0.2);
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    }
    .card svg {
      width: 100px;
      height: 100px;
      margin-bottom: 6px;
    }
    .code {
      font-size: 12px;
      color: #7fb6d8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      font-size: 13px;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>눈 결정 아이콘 (ID 21–30)</h1>
  <div class="grid">

    <!-- 21. P1b Plate with Extensions / 성장하는 유망주 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 기본 육각 판 -->
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" />
          <!-- 안쪽 작은 육각 -->
          <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" />
          <!-- 성장하는 확장(짧은 확장 팔) -->
          <g id="arm-p1b">
            <line x1="0" y1="-16" x2="0" y2="-24" />
            <rect x="-3" y="-24" width="6" height="4" rx="1.5" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p1b" />
          <g transform="rotate(60)"><use href="#arm-p1b" /></g>
          <g transform="rotate(120)"><use href="#arm-p1b" /></g>
          <g transform="rotate(180)"><use href="#arm-p1b" /></g>
          <g transform="rotate(240)"><use href="#arm-p1b" /></g>
          <g transform="rotate(300)"><use href="#arm-p1b" /></g>
        </g>
        <defs>
          <g id="arm-p1b">
            <line x1="0" y1="-16" x2="0" y2="-24" />
            <rect x="-3" y="-24" width="6" height="4" rx="1.5" />
          </g>
        </defs>
      </svg>
      <div class="code">P1b</div>
      <div class="title">성장하는 유망주</div>
    </div>

    <!-- 22. P1c Plate with Broad Branches / 대담한 사업가 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 육각 판 -->
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" />
          <!-- 안쪽 육각 -->
          <polygon points="0,-9 8,-4 8,4 0,9 -8,4 -8,-4" />
          <!-- 넓고 굵은 가지 -->
          <g id="arm-p1c">
            <!-- 메인 브랜치 -->
            <path d="M0 -16 L0 -26" />
            <!-- 넓은 판 형태의 브랜치 -->
            <path d="M0 -26 L8 -22 L8 -18 L0 -20 L-8 -18 L-8 -22 Z" />
            <!-- 짧은 서브 브랜치 -->
            <line x1="-3" y1="-20" x2="-8" y2="-24" />
            <line x1="3" y1="-20" x2="8" y2="-24" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p1c" />
          <g transform="rotate(60)"><use href="#arm-p1c" /></g>
          <g transform="rotate(120)"><use href="#arm-p1c" /></g>
          <g transform="rotate(180)"><use href="#arm-p1c" /></g>
          <g transform="rotate(240)"><use href="#arm-p1c" /></g>
          <g transform="rotate(300)"><use href="#arm-p1c" /></g>
        </g>
        <defs>
          <g id="arm-p1c">
            <path d="M0 -16 L0 -26" />
            <path d="M0 -26 L8 -22 L8 -18 L0 -20 L-8 -18 L-8 -22 Z" />
            <line x1="-3" y1="-20" x2="-8" y2="-24" />
            <line x1="3" y1="-20" x2="8" y2="-24" />
          </g>
        </defs>
      </svg>
      <div class="code">P1c</div>
      <div class="title">대담한 사업가</div>
    </div>

    <!-- 23. P1d Stellar Crystal / 반짝이는 스타 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중심 이중 육각 -->
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" />
          <!-- 반짝이는 별 모양 팔 -->
          <g id="arm-p1d">
            <!-- 메인 팔 -->
            <line x1="0" y1="-16" x2="0" y2="-32" />
            <!-- 양 옆으로 뻗는 별 팔 -->
            <line x1="0" y1="-22" x2="6" y2="-26" />
            <line x1="0" y1="-22" x2="-6" y2="-26" />
            <!-- 끝 작은 별꼭지 -->
            <polygon points="0,-32 3,-29 0,-26 -3,-29" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p1d" />
          <g transform="rotate(60)"><use href="#arm-p1d" /></g>
          <g transform="rotate(120)"><use href="#arm-p1d" /></g>
          <g transform="rotate(180)"><use href="#arm-p1d" /></g>
          <g transform="rotate(240)"><use href="#arm-p1d" /></g>
          <g transform="rotate(300)"><use href="#arm-p1d" /></g>
        </g>
        <defs>
          <g id="arm-p1d">
            <line x1="0" y1="-16" x2="0" y2="-32" />
            <line x1="0" y1="-22" x2="6" y2="-26" />
            <line x1="0" y1="-22" x2="-6" y2="-26" />
            <polygon points="0,-32 3,-29 0,-26 -3,-29" />
          </g>
        </defs>
      </svg>
      <div class="code">P1d</div>
      <div class="title">반짝이는 스타</div>
    </div>

    <!-- 24. P1e Dendrite / 감성 폭발 아티스트 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중심 육각 판 -->
          <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" />
          <!-- 덴드라이트형 팔 (프랙탈 가지) -->
          <g id="arm-p1e">
            <!-- 메인 가지 -->
            <line x1="0" y1="-12" x2="0" y2="-32" />
            <!-- 1단 가지 -->
            <line x1="0" y1="-16" x2="4" y2="-20" />
            <line x1="0" y1="-16" x2="-4" y2="-20" />
            <!-- 2단 가지 -->
            <line x1="0" y1="-22" x2="5" y2="-27" />
            <line x1="0" y1="-22" x2="-5" y2="-27" />
            <!-- 3단 가지 -->
            <line x1="0" y1="-28" x2="6" y2="-32" />
            <line x1="0" y1="-28" x2="-6" y2="-32" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p1e" />
          <g transform="rotate(60)"><use href="#arm-p1e" /></g>
          <g transform="rotate(120)"><use href="#arm-p1e" /></g>
          <g transform="rotate(180)"><use href="#arm-p1e" /></g>
          <g transform="rotate(240)"><use href="#arm-p1e" /></g>
          <g transform="rotate(300)"><use href="#arm-p1e" /></g>
        </g>
        <defs>
          <g id="arm-p1e">
            <line x1="0" y1="-12" x2="0" y2="-32" />
            <line x1="0" y1="-16" x2="4" y2="-20" />
            <line x1="0" y1="-16" x2="-4" y2="-20" />
            <line x1="0" y1="-22" x2="5" y2="-27" />
            <line x1="0" y1="-22" x2="-5" y2="-27" />
            <line x1="0" y1="-28" x2="6" y2="-32" />
            <line x1="0" y1="-28" x2="-6" y2="-32" />
          </g>
        </defs>
      </svg>
      <div class="code">P1e</div>
      <div class="title">감성 폭발 아티스트</div>
    </div>

    <!-- 25. P1f Fernlike Crystal / 숲의 정령 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중심 육각 -->
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <!-- 양쪽으로 휘어진 고사리형 팔 -->
          <g id="arm-p1f">
            <!-- 메인 곡선 줄기 -->
            <path d="M0 -10
                     C2 -16, 3 -20, 2 -24
                     C1 -28, -1 -30, -3 -32" />
            <!-- 줄기에서 나오는 잎 모양 가지 -->
            <line x1="0" y1="-14" x2="4" y2="-16" />
            <line x1="1" y1="-19" x2="5" y2="-21" />
            <line x1="1" y1="-23" x2="5" y2="-25" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p1f" />
          <g transform="rotate(60)"><use href="#arm-p1f" /></g>
          <g transform="rotate(120)"><use href="#arm-p1f" /></g>
          <g transform="rotate(180)"><use href="#arm-p1f" /></g>
          <g transform="rotate(240)"><use href="#arm-p1f" /></g>
          <g transform="rotate(300)"><use href="#arm-p1f" /></g>
        </g>
        <defs>
          <g id="arm-p1f">
            <path d="M0 -10
                     C2 -16, 3 -20, 2 -24
                     C1 -28, -1 -30, -3 -32" />
            <line x1="0" y1="-14" x2="4" y2="-16" />
            <line x1="1" y1="-19" x2="5" y2="-21" />
            <line x1="1" y1="-23" x2="5" y2="-25" />
          </g>
        </defs>
      </svg>
      <div class="code">P1f</div>
      <div class="title">숲의 정령</div>
    </div>

    <!-- 26. P2a Stepped Hexagon / 계단식 성장가 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 계단처럼 겹친 육각들 -->
          <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" />
          <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" />
          <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" />
          <!-- 계단식 성장 가지 -->
          <g id="arm-p2a">
            <line x1="0" y1="-18" x2="0" y2="-30" />
            <line x1="0" y1="-14" x2="4" y2="-18" />
            <line x1="0" y1="-10" x2="-4" y2="-14" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p2a" />
          <g transform="rotate(60)"><use href="#arm-p2a" /></g>
          <g transform="rotate(120)"><use href="#arm-p2a" /></g>
          <g transform="rotate(180)"><use href="#arm-p2a" /></g>
          <g transform="rotate(240)"><use href="#arm-p2a" /></g>
          <g transform="rotate(300)"><use href="#arm-p2a" /></g>
        </g>
        <defs>
          <g id="arm-p2a">
            <line x1="0" y1="-18" x2="0" y2="-30" />
            <line x1="0" y1="-14" x2="4" y2="-18" />
            <line x1="0" y1="-10" x2="-4" y2="-14" />
          </g>
        </defs>
      </svg>
      <div class="code">P2a</div>
      <div class="title">계단식 성장가</div>
    </div>

    <!-- 27. P2b Broad Branch with Sector / 부채꼴 외교관 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중앙 육각 판 -->
          <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" />
          <!-- 부채꼴 가지 -->
          <g id="arm-p2b">
            <!-- 부채꼴 메인 -->
            <path d="M0 -14
                     Q8 -18, 14 -14
                     Q8 -10, 0 -14 Z" />
            <!-- 안쪽 가는 선들 (부채살) -->
            <line x1="0" y1="-14" x2="5" y2="-17" />
            <line x1="0" y1="-14" x2="9" y2="-15" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p2b" />
          <g transform="rotate(60)"><use href="#arm-p2b" /></g>
          <g transform="rotate(120)"><use href="#arm-p2b" /></g>
          <g transform="rotate(180)"><use href="#arm-p2b" /></g>
          <g transform="rotate(240)"><use href="#arm-p2b" /></g>
          <g transform="rotate(300)"><use href="#arm-p2b" /></g>
        </g>
        <defs>
          <g id="arm-p2b">
            <path d="M0 -14
                     Q8 -18, 14 -14
                     Q8 -10, 0 -14 Z" />
            <line x1="0" y1="-14" x2="5" y2="-17" />
            <line x1="0" y1="-14" x2="9" y2="-15" />
          </g>
        </defs>
      </svg>
      <div class="code">P2b</div>
      <div class="title">부채꼴 외교관</div>
    </div>

    <!-- 28. P2c Dendrite with Sector / 화려한 중재자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 중심 육각 -->
          <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" />
          <!-- 덴드라이트 + 부채꼴 끝 -->
          <g id="arm-p2c">
            <!-- 메인 가지 -->
            <line x1="0" y1="-12" x2="0" y2="-26" />
            <!-- 가지 -->
            <line x1="0" y1="-16" x2="4" y2="-20" />
            <line x1="0" y1="-20" x2="-4" y2="-24" />
            <!-- 끝 부채꼴 -->
            <path d="M0 -26
                     Q6 -30, 11 -26
                     Q6 -22, 0 -26 Z" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p2c" />
          <g transform="rotate(60)"><use href="#arm-p2c" /></g>
          <g transform="rotate(120)"><use href="#arm-p2c" /></g>
          <g transform="rotate(180)"><use href="#arm-p2c" /></g>
          <g transform="rotate(240)"><use href="#arm-p2c" /></g>
          <g transform="rotate(300)"><use href="#arm-p2c" /></g>
        </g>
        <defs>
          <g id="arm-p2c">
            <line x1="0" y1="-12" x2="0" y2="-26" />
            <line x1="0" y1="-16" x2="4" y2="-20" />
            <line x1="0" y1="-20" x2="-4" y2="-24" />
            <path d="M0 -26
                     Q6 -30, 11 -26
                     Q6 -22, 0 -26 Z" />
          </g>
        </defs>
      </svg>
      <div class="code">P2c</div>
      <div class="title">화려한 중재자</div>
    </div>

    <!-- 29. P2d Plate with Dendritic Ext / 늦바람 난 모범생 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 조용한 기본 육각 판 -->
          <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" />
          <!-- 바깥 얇은 육각 링 -->
          <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" />
          <!-- 끝부분만 화려한 덴드라이트 확장 -->
          <g id="arm-p2d">
            <!-- 짧은 팔 -->
            <line x1="0" y1="-18" x2="0" y2="-28" />
            <!-- 덴드라이트 확장 -->
            <line x1="0" y1="-24" x2="4" y2="-28" />
            <line x1="0" y1="-24" x2="-4" y2="-28" />
            <line x1="0" y1="-28" x2="5" y2="-32" />
            <line x1="0" y1="-28" x2="-5" y2="-32" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p2d" />
          <g transform="rotate(60)"><use href="#arm-p2d" /></g>
          <g transform="rotate(120)"><use href="#arm-p2d" /></g>
          <g transform="rotate(180)"><use href="#arm-p2d" /></g>
          <g transform="rotate(240)"><use href="#arm-p2d" /></g>
          <g transform="rotate(300)"><use href="#arm-p2d" /></g>
        </g>
        <defs>
          <g id="arm-p2d">
            <line x1="0" y1="-18" x2="0" y2="-28" />
            <line x1="0" y1="-24" x2="4" y2="-28" />
            <line x1="0" y1="-24" x2="-4" y2="-28" />
            <line x1="0" y1="-28" x2="5" y2="-32" />
            <line x1="0" y1="-28" x2="-5" y2="-32" />
          </g>
        </defs>
      </svg>
      <div class="code">P2d</div>
      <div class="title">늦바람 난 모범생</div>
    </div>

    <!-- 30. P2e Plate with Simple Ext / 실용적 창작자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 기본 육각 판 -->
          <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" />
          <!-- 안쪽 작은 육각 -->
          <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" />
          <!-- 단순 확장 팔 -->
          <g id="arm-p2e">
            <line x1="0" y1="-14" x2="0" y2="-24" />
            <line x1="-2" y1="-18" x2="-6" y2="-22" />
            <line x1="2" y1="-18" x2="6" y2="-22" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p2e" />
          <g transform="rotate(60)"><use href="#arm-p2e" /></g>
          <g transform="rotate(120)"><use href="#arm-p2e" /></g>
          <g transform="rotate(180)"><use href="#arm-p2e" /></g>
          <g transform="rotate(240)"><use href="#arm-p2e" /></g>
          <g transform="rotate(300)"><use href="#arm-p2e" /></g>
        </g>
        <defs>
          <g id="arm-p2e">
            <line x1="0" y1="-14" x2="0" y2="-24" />
            <line x1="-2" y1="-18" x2="-6" y2="-22" />
            <line x1="2" y1="-18" x2="6" y2="-22" />
          </g>
        </defs>
      </svg>
      <div class="code">P2e</div>
      <div class="title">실용적 창작자</div>
    </div>

  </div>
</body>
</html>
