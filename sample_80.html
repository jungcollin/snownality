<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Magono-Lee Snow Crystal Icons (71–80)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b16;
      color: #e5f4ff;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 20px;
      letter-spacing: 0.03em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(7, 21, 38, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(160, 210, 235, 0.2);
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    }
    .card svg {
      width: 100px;
      height: 100px;
      margin-bottom: 6px;
    }
    .code {
      font-size: 12px;
      color: #7fb6d8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      font-size: 13px;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>눈 결정 아이콘 (ID 71–80)</h1>
  <div class="grid">

    <!-- 71. G1 Minute Column / 꼬마 기둥 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 아주 작은 육각 기둥 -->
        <g transform="translate(50,50)">
          <!-- 위아래 작은 단면 -->
          <polygon points="0,-10 5,-7 5,-3 0,0 -5,-3 -5,-7" />
          <polygon points="0,10 5,7 5,3 0,0 -5,3 -5,7" />
          <!-- 기둥 몸통 -->
          <line x1="0" y1="-10" x2="0" y2="10" />
          <!-- 작음을 강조하는 주변 점들 -->
          <circle cx="10" cy="-2" r="1.2" />
          <circle cx="-10" cy="2" r="1.2" />
        </g>
      </svg>
      <div class="code">G1</div>
      <div class="title">꼬마 기둥</div>
    </div>

    <!-- 72. G2 Minute Plate / 꼬마 육각형 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 작은 육각 판 -->
        <g transform="translate(50,50)">
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <!-- 얇은 외곽 링 -->
          <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" />
          <!-- 중심 점 -->
          <circle cx="0" cy="0" r="1.5" />
        </g>
      </svg>
      <div class="code">G2</div>
      <div class="title">꼬마 육각형</div>
    </div>

    <!-- 73. G3 Minute Branch / 호기심 새싹 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 작은 가지가 3방향으로 난 새싹 구조 -->
        <g transform="translate(50,50)">
          <!-- 중심 작은 육각 -->
          <polygon points="0,-5 4,-3 4,3 0,5 -4,3 -4,-3" />
          <!-- 3개의 메인 가지 (120도 간격) -->
          <g id="arm-g3">
            <line x1="0" y1="-5" x2="0" y2="-16" />
            <circle cx="0" cy="-16" r="1.4" />
          </g>
          <use href="#arm-g3" />
          <g transform="rotate(120)"><use href="#arm-g3" /></g>
          <g transform="rotate(240)"><use href="#arm-g3" /></g>
        </g>
      </svg>
      <div class="code">G3</div>
      <div class="title">호기심 새싹</div>
    </div>

    <!-- 74. G4 Minute Assembly / 옹기종기 친구들 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 작은 눈결정 여러 개가 모인 집합 -->
        <g transform="translate(50,50)">
          <!-- 가운데 코어 -->
          <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" />
          <!-- 주변 작은 판/기둥 -->
          <polygon points="-10,-4 -5,-2 -5,2 -10,4 -15,2 -15,-2" />
          <polygon points="10,-2 14,0 14,4 10,6 6,4 6,0" />
          <polygon points="-6,10 -2,12 -2,16 -6,18 -10,16 -10,12" />
          <polygon points="6,10 10,12 10,16 6,18 2,16 2,12" />
          <!-- 얇은 연결선 -->
          <line x1="0" y1="0" x2="-10" y2="0" />
          <line x1="0" y1="0" x2="10" y2="1" />
          <line x1="0" y1="4" x2="-4" y2="12" />
          <line x1="2" y1="4" x2="6" y2="12" />
        </g>
      </svg>
      <div class="code">G4</div>
      <div class="title">옹기종기 친구들</div>
    </div>

    <!-- 75. G5 Irregular Germ / 개구쟁이 꼬마 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 불규칙한 작은 씨앗 모양 -->
        <g transform="translate(50,50)">
          <!-- 삐뚤삐뚤한 코어 -->
          <polygon points="0,-8 6,-4 5,4 -2,8 -8,4 -7,-3" />
          <!-- 방향이 제각각인 짧은 팔 -->
          <line x1="0" y1="-8" x2="4" y2="-14" />
          <line x1="6" y1="-4" x2="12" y2="-6" />
          <line x1="5" y1="4" x2="10" y2="8" />
          <line x1="-2" y1="8" x2="-4" y2="14" />
          <line x1="-8" y1="4" x2="-12" y2="8" />
          <line x1="-7" y1="-3" x2="-12" y2="-8" />
        </g>
      </svg>
      <div class="code">G5</div>
      <div class="title">개구쟁이 꼬마</div>
    </div>

    <!-- 76. G6 Hexagonal Germ / 완벽주의 씨앗 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 매우 작은 육각 눈 결정의 씨앗 -->
        <g transform="translate(50,50)">
          <!-- 중심 육각 -->
          <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" />
          <!-- 얇은 육각 링 -->
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <!-- 아주 짧은 6방향 팔 -->
          <g id="arm-g6">
            <line x1="0" y1="-10" x2="0" y2="-15" />
          </g>
          <use href="#arm-g6" />
          <g transform="rotate(60)"><use href="#arm-g6" /></g>
          <g transform="rotate(120)"><use href="#arm-g6" /></g>
          <g transform="rotate(180)"><use href="#arm-g6" /></g>
          <g transform="rotate(240)"><use href="#arm-g6" /></g>
          <g transform="rotate(300)"><use href="#arm-g6" /></g>
        </g>
      </svg>
      <div class="code">G6</div>
      <div class="title">완벽주의 씨앗</div>
    </div>

    <!-- 77. C1j Column with Dendrites (Tip) / 섬세한 마무리 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 양 끝에 덴드라이트가 달려있는 기둥 -->
        <g transform="translate(50,50)">
          <!-- 중앙 기둥 -->
          <line x1="0" y1="-24" x2="0" y2="24" />
          <!-- 가운데 약한 육각 -->
          <polygon points="0,-4 4,-2 4,2 0,4 -4,2 -4,-2" />
          <!-- 위쪽 덴드라이트 팁 -->
          <g id="tip-dend">
            <line x1="0" y1="-24" x2="0" y2="-32" />
            <line x1="0" y1="-28" x2="4" y2="-32" />
            <line x1="0" y1="-28" x2="-4" y2="-32" />
            <circle cx="0" cy="-32" r="1.6" />
          </g>
          <!-- 아래쪽 덴드라이트 팁 (대칭) -->
          <g transform="scale(1,-1)">
            <use href="#tip-dend" />
          </g>
        </g>
      </svg>
      <div class="code">C1j</div>
      <div class="title">섬세한 마무리</div>
    </div>

    <!-- 78. P8a Arrowhead / 목표지향 화살 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 육각 대칭으로 배치된 화살촉 모양 판 -->
        <g transform="translate(50,50)">
          <!-- 중심 육각 -->
          <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" />
          <!-- 한 방향의 화살촉 -->
          <g id="arm-p8a">
            <path d="M0 -6 L0 -22" />
            <polygon points="0,-22 6,-16 0,-10 -6,-16" />
          </g>
          <!-- 6방향 회전 -->
          <use href="#arm-p8a" />
          <g transform="rotate(60)"><use href="#arm-p8a" /></g>
          <g transform="rotate(120)"><use href="#arm-p8a" /></g>
          <g transform="rotate(180)"><use href="#arm-p8a" /></g>
          <g transform="rotate(240)"><use href="#arm-p8a" /></g>
          <g transform="rotate(300)"><use href="#arm-p8a" /></g>
        </g>
      </svg>
      <div class="code">P8a</div>
      <div class="title">목표지향 화살</div>
    </div>

    <!-- 79. P8b Tsuzumi (Hand Drum) / 장구 치는 광대 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 일본 장구(츠즈미)처럼 가운데가 잘록한 드럼형 판 -->
        <g transform="translate(50,50)">
          <!-- 장구 실루엣 -->
          <path d="M-10 -18
                   C-4 -10, -4 -4, -8 0
                   C-4 4, -4 10, -10 18" />
          <path d="M10 -18
                   C4 -10, 4 -4, 8 0
                   C4 4, 4 10, 10 18" />
          <line x1="-10" y1="-18" x2="10" y2="-18" />
          <line x1="-10" y1="18" x2="10" y2="18" />
          <!-- 장구 끈 -->
          <line x1="-8" y1="-8" x2="8" y2="-4" />
          <line x1="-8" y1="4" x2="8" y2="8" />
          <!-- 주변에 리듬감 있는 작은 점 -->
          <circle cx="-16" cy="0" r="1.4" />
          <circle cx="16" cy="-2" r="1.4" />
        </g>
      </svg>
      <div class="code">P8b</div>
      <div class="title">장구 치는 광대</div>
    </div>

    <!-- 80. H1 Hailstone / 슈퍼 헤비급 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 커다란 우박 덩어리 -->
        <g transform="translate(50,50)">
          <!-- 바깥 둥근 형태 -->
          <circle cx="0" cy="0" r="22" />
          <!-- 내부 육각 크랙 -->
          <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" />
          <line x1="0" y1="-10" x2="0" y2="-20" />
          <line x1="9" y1="-5" x2="18" y2="-6" />
          <line x1="9" y1="5" x2="16" y2="10" />
          <line x1="0" y1="10" x2="0" y2="20" />
          <line x1="-9" y1="5" x2="-16" y2="10" />
          <line x1="-9" y1="-5" x2="-18" y2="-6" />
          <!-- 표면의 요철 -->
          <circle cx="10" cy="-14" r="1.8" />
          <circle cx="-12" cy="-10" r="1.8" />
          <circle cx="14" cy="6" r="1.8" />
          <circle cx="-8" cy="14" r="1.8" />
        </g>
      </svg>
      <div class="code">H1</div>
      <div class="title">슈퍼 헤비급</div>
    </div>

  </div>
</body>
</html>
