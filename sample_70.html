<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Magono-Lee Snow Crystal Icons (61–70)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b16;
      color: #e5f4ff;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 20px;
      letter-spacing: 0.03em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(7, 21, 38, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(160, 210, 235, 0.2);
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    }
    .card svg {
      width: 100px;
      height: 100px;
      margin-bottom: 6px;
    }
    .code {
      font-size: 12px;
      color: #7fb6d8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      font-size: 13px;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>눈 결정 아이콘 (ID 61–70)</h1>
  <div class="grid">

    <!-- 61. R3a Graupel (Cone) / 원뿔형 싸라기 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,55)">
          <!-- 원뿔 실루엣 -->
          <polygon points="0,-24 16,14 -16,14" />
          <!-- 내부 싸라기 알갱이들 -->
          <circle cx="0" cy="-12" r="1.8" />
          <circle cx="-6" cy="-8" r="1.6" />
          <circle cx="7" cy="-6" r="1.6" />
          <circle cx="-10" cy="0" r="1.6" />
          <circle cx="10" cy="2" r="1.6" />
          <circle cx="-4" cy="6" r="1.6" />
          <circle cx="3" cy="8" r="1.6" />
        </g>
      </svg>
      <div class="code">R3a</div>
      <div class="title">원뿔형 싸라기</div>
    </div>

    <!-- 62. R3b Graupel (Lump) / 덩어리 눈 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <g transform="translate(50,50)">
          <!-- 덩어리 실루엣 -->
          <path d="M0 -18
                   C10 -18, 18 -10, 18 0
                   C18 10, 10 18, 0 18
                   C-10 18, -18 10, -18 0
                   C-18 -10, -10 -18, 0 -18 Z" />
          <!-- 내부 알갱이들 -->
          <circle cx="-8" cy="-6" r="1.8" />
          <circle cx="7" cy="-4" r="1.8" />
          <circle cx="-4" cy="0" r="1.8" />
          <circle cx="5" cy="5" r="1.8" />
          <circle cx="0" cy="10" r="1.8" />
          <circle cx="-9" cy="6" r="1.6" />
        </g>
      </svg>
      <div class="code">R3b</div>
      <div class="title">덩어리 눈</div>
    </div>

    <!-- 63. R4a Graupel-like Snow / 눈보라의 전조 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 바람 방향으로 길게 늘어진 싸라기눈 -->
        <g transform="translate(50,50)">
          <!-- 흐름을 나타내는 곡선 -->
          <path d="M-20 -10
                   C-10 -18, 5 -18, 18 -8
                   C22 -4, 22 4, 18 8
                   C5 18, -10 18, -20 10" />
          <!-- 곡선을 따라 박힌 알갱이 -->
          <circle cx="-14" cy="-9" r="1.6" />
          <circle cx="-4" cy="-13" r="1.6" />
          <circle cx="6" cy="-10" r="1.6" />
          <circle cx="14" cy="-4" r="1.6" />
          <circle cx="14" cy="4" r="1.6" />
          <circle cx="6" cy="10" r="1.6" />
          <circle cx="-4" cy="13" r="1.6" />
          <circle cx="-14" cy="9" r="1.6" />
        </g>
      </svg>
      <div class="code">R4a</div>
      <div class="title">눈보라의 전조</div>
    </div>

    <!-- 64. R4b Graupel-like Snow (Lump) / 뭉치면 산다 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 여러 덩어리가 모인 싸라기눈 -->
        <g transform="translate(50,50)">
          <!-- 세 개의 겹친 덩어리 -->
          <path d="M-10 -4
                   C-2 -10, 6 -10, 12 -4
                   C16 0, 16 6, 12 10
                   C6 14, -2 14, -10 8
                   C-14 4, -14 0, -10 -4 Z" />
          <path d="M-14 -8
                   C-8 -14, 0 -14, 6 -8
                   C10 -4, 10 0, 6 4
                   C0 8, -8 8, -14 2
                   C-18 -2, -18 -4, -14 -8 Z" />
          <path d="M-4 0
                   C4 -4, 12 -4, 16 2
                   C20 6, 18 12, 12 16
                   C6 20, -2 20, -8 14
                   C-10 12, -10 6, -4 0 Z" />
          <!-- 알갱이들 -->
          <circle cx="-6" cy="-6" r="1.5" />
          <circle cx="2" cy="-4" r="1.5" />
          <circle cx="8" cy="0" r="1.5" />
          <circle cx="0" cy="6" r="1.5" />
          <circle cx="-8" cy="2" r="1.5" />
        </g>
      </svg>
      <div class="code">R4b</div>
      <div class="title">뭉치면 산다</div>
    </div>

    <!-- 65. R4c Graupel-like Snow (Branch) / 거친 야생화 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 가지를 따라 달린 싸라기 알갱이들 -->
        <g transform="translate(50,50)">
          <!-- 중심 줄기 -->
          <line x1="0" y1="-20" x2="0" y2="20" />
          <!-- 가지 -->
          <line x1="0" y1="-8" x2="10" y2="-14" />
          <line x1="0" y1="-2" x2="-10" y2="-10" />
          <line x1="0" y1="6" x2="11" y2="12" />
          <line x1="0" y1="12" x2="-9" y2="18" />
          <!-- 가지 끝과 줄기 주변의 알갱이 -->
          <circle cx="0" cy="-20" r="1.6" />
          <circle cx="0" cy="20" r="1.6" />
          <circle cx="10" cy="-14" r="1.6" />
          <circle cx="-10" cy="-10" r="1.6" />
          <circle cx="11" cy="12" r="1.6" />
          <circle cx="-9" cy="18" r="1.6" />
          <circle cx="0" cy="0" r="1.4" />
        </g>
      </svg>
      <div class="code">R4c</div>
      <div class="title">거친 야생화</div>
    </div>

    <!-- 66. I1 Ice Particle / 미완의 대기 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 날카로운 얼음 파편 -->
        <g transform="translate(50,50)">
          <!-- 불완전한 조각 실루엣 -->
          <polygon points="0,-18 10,-10 6,0 12,10 0,16 -10,8 -8,-4 -14,-12" />
          <!-- 내부 균열선 -->
          <line x1="-8" y1="-8" x2="4" y2="0" />
          <line x1="-2" y1="-14" x2="2" y2="-4" />
          <line x1="0" y1="4" x2="-4" y2="12" />
        </g>
      </svg>
      <div class="code">I1</div>
      <div class="title">미완의 대기</div>
    </div>

    <!-- 67. I2 Rimmed Particle / 다듬어지는 원석 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 가장자리에 서리가 둘러진 얼음 조각 -->
        <g transform="translate(50,50)">
          <!-- 안쪽 불규칙 조각 -->
          <polygon points="0,-14 10,-8 8,4 0,12 -9,7 -8,-6" />
          <!-- 바깥 림 -->
          <polygon points="0,-20 13,-11 12,6 0,18 -13,10 -12,-9" />
          <!-- 가장자리에 작은 서리 알갱이 -->
          <circle cx="0" cy="-20" r="1.5" />
          <circle cx="10" cy="-8" r="1.5" />
          <circle cx="11" cy="4" r="1.5" />
          <circle cx="0" cy="18" r="1.5" />
          <circle cx="-11" cy="8" r="1.5" />
          <circle cx="-11" cy="-6" r="1.5" />
        </g>
      </svg>
      <div class="code">I2</div>
      <div class="title">다듬어지는 원석</div>
    </div>

    <!-- 68. I3a Broken Crystal / 상처 입은 치유자 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 일부가 부러진 육각 판 -->
        <g transform="translate(50,50)">
          <!-- 손상된 육각형 -->
          <polygon points="0,-14 12,-7 10,6 0,14 -10,8 -12,-2" />
          <!-- 깨진 자리 표시 (크랙 라인) -->
          <line x1="-12" y1="-2" x2="-4" y2="-8" />
          <line x1="-4" y1="-8" x2="4" y2="-2" />
          <!-- 떨어져 나간 조각 -->
          <polygon points="-16,-10 -10,-10 -8,-4 -14,-4" />
          <!-- 회복을 상징하는 작은 중심 육각 -->
          <polygon points="0,-4 4,-2 4,2 0,4 -4,2 -4,-2" />
        </g>
      </svg>
      <div class="code">I3a</div>
      <div class="title">상처 입은 치유자</div>
    </div>

    <!-- 69. I3b Miscellaneous Crystal / 정의 불가 미스터리 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 여러 조각이 뒤섞인 정체불명 결정 -->
        <g transform="translate(50,50)">
          <!-- 중심 불규칙 코어 -->
          <polygon points="0,-8 8,-4 6,4 -2,8 -10,4 -8,-4" />
          <!-- 각 방향으로 다른 모양의 조각 -->
          <path d="M0 -8 L4 -16 L-2 -14 Z" />
          <path d="M8 -4 L16 0 L10 4 Z" />
          <path d="M6 4 L10 12 L2 10 Z" />
          <path d="M-2 8 L-4 16 L-10 10 Z" />
          <path d="M-10 4 L-16 -2 L-8 -4 Z" />
          <path d="M-8 -4 L-4 -12 L0 -8 Z" />
          <!-- 랜덤한 작은 점들 -->
          <circle cx="3" cy="0" r="1.2" />
          <circle cx="-5" cy="1" r="1.2" />
          <circle cx="1" cy="6" r="1.2" />
        </g>
      </svg>
      <div class="code">I3b</div>
      <div class="title">정의 불가 미스터리</div>
    </div>

    <!-- 70. I4 Recrystallized Crystal / 부활한 불사조 -->
    <div class="card">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           stroke="#A0D2EB"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <!-- 부서진 조각 주변으로 다시 자라나는 눈결정 -->
        <g transform="translate(50,50)">
          <!-- 중심 육각 코어(재결정된 핵) -->
          <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" />
          <!-- 바깥 부서진 링 -->
          <polygon points="0,-16 12,-8 14,2 8,14 -2,18 -12,10 -16,0 -10,-12" />
          <!-- 깨진 링을 가로지르는 크랙 -->
          <line x1="-12" y1="-2" x2="10" y2="4" />
          <!-- 새로 자라나는 6방향 팔 (짧은 덴드라이트) -->
          <g id="arm-i4">
            <line x1="0" y1="-6" x2="0" y2="-20" />
            <line x1="0" y1="-12" x2="4" y2="-16" />
            <line x1="0" y1="-12" x2="-4" y2="-16" />
          </g>
          <use href="#arm-i4" />
          <g transform="rotate(60)"><use href="#arm-i4" /></g>
          <g transform="rotate(120)"><use href="#arm-i4" /></g>
          <g transform="rotate(180)"><use href="#arm-i4" /></g>
          <g transform="rotate(240)"><use href="#arm-i4" /></g>
          <g transform="rotate(300)"><use href="#arm-i4" /></g>
        </g>
        <defs>
          <g id="arm-i4">
            <line x1="0" y1="-6" x2="0" y2="-20" />
            <line x1="0" y1="-12" x2="4" y2="-16" />
            <line x1="0" y1="-12" x2="-4" y2="-16" />
          </g>
        </defs>
      </svg>
      <div class="code">I4</div>
      <div class="title">부활한 불사조</div>
    </div>

  </div>
</body>
</html>
